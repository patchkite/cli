name: Update fixtures

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: patchkite/patchkite release tag (default latest)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/update-fixtures.sh ${{ inputs.tag }}
      - name: Open a pull request if fixtures changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$(git status --porcelain test/fixtures)" ] && exit 0
          TAG=$(cat test/fixtures/FIXTURES_VERSION)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "fixtures/$TAG"
          git add -A test/fixtures
          git commit -m "test: update fixtures to $TAG"
          git push -f origin "fixtures/$TAG"
          gh pr create --title "Update fixtures to $TAG" --body "Reference fixtures from patchkite/patchkite $TAG." || true
